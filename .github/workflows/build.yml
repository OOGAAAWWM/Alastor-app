name: Compila App Alastor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
      - name: Genera struttura progetto Flutter
        run: flutter create . --platforms=android,windows
      - name: Scarica dipendenze
        run: flutter pub get
      - name: Compila APK Android
        run: flutter build apk --release
      - name: Carica file APK
        uses: actions/upload-artifact@v4
        with:
          name: Alastor-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
      - name: Abilita supporto Windows
        run: flutter config --enable-windows-desktop
      - name: Genera struttura progetto Flutter
        run: flutter create . --platforms=windows
      - name: Scarica dipendenze
        run: flutter pub get
      - name: Compila EXE Windows
        run: flutter build windows --release
      - name: Carica file EXE PC
        uses: actions/upload-artifact@v4
        with:
          name: Alastor-PC-Windows
          path: build/windows/x64/runner/Release/
